# Server Configuration
server.port=8080
server.servlet.context-path=

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/nexushr_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Rishi@2207
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JWT Settings
nexushr.jwt.secret=9a4f2c8d3b7a1e5f8c3d6b2a1f4e7d9c0b3a6e9f2d5c8b1a4f7e0d3c6b9a2f5e
nexushr.jwt.access-expiration=86400000
nexushr.jwt.refresh-expiration=604800000

# OpenAPI Swagger Configurations
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Logging Configuration
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.nexushr=DEBUG
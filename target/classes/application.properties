# =====================================
# Server Configuration
# =====================================
server.port=8080

# =====================================
# MySQL Database Configuration
# =====================================
spring.datasource.url=jdbc:mysql://localhost:3306/nexushr?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Rishi@2207
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================
# JPA / Hibernate Configuration
# =====================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =====================================
# Flyway Configuration
# =====================================
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# =====================================
# JWT Configuration
# =====================================
nexushr.jwt.secret=9a4f2c8d3b7a1e5f8c3d6b2a1f4e7d9c0b3a6e9f2d5c8b1a4f7e0d3c6b9a2f5e
nexushr.jwt.access-expiration=86400000
nexushr.jwt.refresh-expiration=604800000

# =====================================
# Swagger / OpenAPI
# =====================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# =====================================
# Logging
# =====================================
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.nexushr=DEBUG